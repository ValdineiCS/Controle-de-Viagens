<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Viagem</title>
</head>
<body>
    <header>
    <h1>Cadastro de Viagens</h1>
        </header>

        <form action id="formViagem">
            <p>Origem: <input type="text" name="" id="inOrigem"></p>
            <p>Destino: <input type="text" name="" id="inDestino"></p>
            <p>Distância (KM): <input type="text" name="" id="inDistancia"></p>
            <p>Valor gasto: <input type="text" name="" id="inValor"></p>

            <input type="button" name="" id="botSalvar" value="Salvar Viagem">
        </form>

        <h3 id="msg"></h3>

        <script src="script.js"></script>

</body>
</html>
